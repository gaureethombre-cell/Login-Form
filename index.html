<!DOCTYPE html>
<html lang="en">
<head>
    <title>login form</title>
    <link rel="stylesheet" href="task1.css">

</head>
<body>
    <div class="login-box">
        <h2>Login</h2>

        <label>Username</label>
        <input type="text">

        <label>Email</label>
        <input type="email">

        <br><br>

        <label>Password</label>
        <input type="password">

        <br><br>

        <label class="remember">
            <input type="checkbox">
            Remember me
        </label>

        <br><br>

        <a href="#">Forgot password?</a>

        <br><br>

        <button>Login</button>

    </div>
</body>
</html>
